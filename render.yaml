services:
  - type: web
    name: fleetguard-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_SERVER_PORT
        value: "8501"
      - key: STREAMLIT_SERVER_ADDRESS
        value: "0.0.0.0"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fleetguard-db
          property: connectionString
      - key: MLFLOW_TRACKING_URI
        value: "file:///app/mlruns"
      - key: SIMULATION_SPEED
        value: "1.0"
      - key: DEMO_MODE
        value: "true"

databases:
  - name: fleetguard-db
    databaseName: fleetguard
    user: fleetguard_user
    plan: free
    region: oregon
    ipAllowList: []